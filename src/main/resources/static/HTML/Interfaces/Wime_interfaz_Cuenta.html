<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil Usuario | Wime</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../Css/Interfaces/Wime_interfaz_cuenta.css">
  <link rel="icon" type="image/png" href="/IMG/Logo_Wime.png" />
  
  <script defer src="../../Js/Modules/Wime_Cuenta.js"></script>
  <script defer src="../../Js/Functions/Wime_Func_Reportes.js"></script>
  <script defer src="../../Js/Functions/Wime_Func_Calendario.js"></script>

</head>
<body>

<div class="sidebar">
    <h2>WIME</h2>
    <hr>
    <nav>
        <a href="/tablero"><i class="bi bi-grid-1x2"></i> Mi Tablero</a>
        <a href="#" class="nav-active"><i class="bi bi-person-circle"></i> Perfil</a>
        <button class="nav-btn" data-bs-toggle="modal" data-bs-target="#modalTarea"><i class="bi bi-plus-circle"></i> Nueva Tarea</button>
        <button class="nav-btn" data-bs-toggle="modal" data-bs-target="#modalRutina"><i class="bi bi-calendar-plus"></i> Nueva Rutina</button>
        <button class="nav-btn" data-bs-toggle="modal" data-bs-target="#modalNotif"><i class="bi bi-bell"></i>Notificaciones</button>
        <hr>
        <button class="nav-btn" onclick="cerrarSesion()"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</button>
    </nav>

    <div class="sidebar-calendar">
        <div class="d-flex justify-content-between align-items-center mb-3 text-white">
            <i class="bi bi-chevron-left cursor-pointer" onclick="moveMonth(-1)"></i>
            <span id="calMonthYear" class="fw-bold"></span>
            <i class="bi bi-chevron-right cursor-pointer" onclick="moveMonth(1)"></i>
        </div>
        <div class="cal-grid" id="calGrid"></div>
    </div>
</div>

<div class="content">

  <button id="themeToggle" class="theme-btn">
    <i id="themeIcon" class="bi bi-sun"></i>
  </button>

  <div class="container-fluid d-flex justify-content-center">
    <div class="col-12 col-lg-10 col-xl-8">
      
      <div class="card p-4 mb-4 position-relative border-0 shadow">
        <button type="button" class="btn-settings-icon" data-bs-toggle="modal" data-bs-target="#modalAjustesCuenta">
            <i class="bi bi-gear-fill"></i>
        </button>

        <div class="text-center mb-4">
          <div class="profile-img-container shadow">

                <!-- correo del usuario -->
            <div id="correoUsuario" class="correo-usuario"></div>
            <img id="preview" src="../../IMG/EmptyAvatar.jpeg" class="profile-img" alt="Perfil">
          </div>

        <form>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">Cambiar Foto</label>
              <input type="file" class="form-control" id="imageInput">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">Nombre</label>
              <input type="text" id="nombreUsuario" class="form-control" placeholder="Escribe tu nombre">
            </div>
          </div>
          <button type="button" onclick="guardarCambiosPerfil()" class="btn btn-gradient w-100 py-2 mt-2 fw-bold rounded-pill">
          Guardar Cambios
          </button>

        </form>
      </div>

            <div class="card p-4 border-0 shadow">
        <h5 class="fw-bold mb-4 d-flex justify-content-between align-items-center">
          <span><i class="bi bi-file-earmark-arrow-down me-2"></i>Reportes y respaldo</span>
          <span class="badge bg-danger rounded-pill" style="font-size: 0.7rem;">PDF / CSV</span>
        </h5>

        <form id="form-reporte" class="row g-3">
          <div class="col-md-7">
            <label for="tipo-reporte" class="form-label fw-bold">Tipo de reporte</label>

            <select id="tipo-reporte" class="form-select rounded-pill">
              <option value="">Selecciona una opción</option>
              <option value="tareas">Reporte de Tareas</option>
              <option value="rutinas">Reporte de Rutinas</option>
            </select>

            <div class="col-12">
                <p class="small text-muted mb-0">Selecciona el tipo y luego exporta PDF o usa importación/exportación CSV.</p>
            </div>

          </div>


          <div class="col-md-5">
            <label class="form-label fw-bold">Exportar</label>
            <div class="dropdown d-grid">
              <button class="btn btn-gradient dropdown-toggle rounded-pill fw-bold" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                Seleccionar Formato
              </button>
              <ul class="dropdown-menu w-100 shadow-sm">
                <li><button type="button" id="menu-export-pdf" class="dropdown-item">Exportar PDF</button></li>
                <li><button type="button" id="menu-export-csv" class="dropdown-item">Exportar CSV</button></li>
              </ul>
            </div>

          <div class="col-12">
            <hr class="my-8 opacity-25">
          </div>

          <div class="col-md-12">
            <label for="file-import" class="form-label fw-bold">Importar CSV</label>
            <input id="file-import" type="file" class="form-control" accept=".csv,text/csv">
          </div>

          <div class="col-md-12 my-3 d-grid">
            <button type="button" id="btn-import" class="btn btn-outline-primary rounded-pill fw-bold">
              Importar CSV
            </button>
          </div>

          </div>
        </form>

    </div>
  </div>
</div>


<div class="modal fade" id="modalAjustesCuenta" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg p-4">
            <div class="modal-header border-0 p-0 mb-3">
                <h5 class="modal-title fw-bold">Ajustes de Seguridad</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0">
              
                <div class="mb-3 position-relative">
                  <label class="form-label fw-bold small">Contraseña Actual</label>
                  <input type="password" id="passwordActual" class="form-control rounded-pill px-4 py-2">
                  <i class="bi bi-eye-slash toggle-pass" onclick="togglePassword('passwordActual', this)"></i>
                </div>

                <div class="mb-3 position-relative">
                  <label class="form-label fw-bold small">Nueva Contraseña</label>
                  <input type="password" id="nuevaPassword" class="form-control rounded-pill px-4 py-2">
                  <i class="bi bi-eye-slash toggle-pass" onclick="togglePassword('nuevaPassword', this)"></i>
                </div>

                <div class="mb-3 position-relative">
                  <label class="form-label fw-bold small">Confirmar Contraseña</label>
                  <input type="password" id="confirmarPassword" class="form-control rounded-pill px-4 py-2">
                  <i class="bi bi-eye-slash toggle-pass" onclick="togglePassword('confirmarPassword', this)"></i>
                </div>
                <button type="button" class="btn btn-gradient w-100 py-3 fw-bold rounded-pill text-white mt-2" onclick="confirmarCambiosToast()">
                    Actualizar Datos
                </button>
                <button
                    type="button"
                    class="btn btn-outline-danger w-100 py-2 fw-bold rounded-pill mt-3"
                    data-bs-toggle="modal"
                    data-bs-target="#modalEliminarCuenta"
                    data-bs-dismiss="modal"
                >
                    Eliminar cuenta
                </button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalEliminarCuenta" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg p-4">
            <div class="modal-header border-0 p-0 mb-3">
                <h5 class="modal-title fw-bold text-danger">Eliminar cuenta</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0">
                <p class="mb-3 fw-semibold">
                    ¿Seguro que quieres eliminar la cuenta <span id="correoEliminarCuenta"></span>?
                </p>
                <div class="mb-3">
                    <label class="form-label fw-bold small">Confirma tu contraseña</label>
                    <input type="password" id="passwordEliminarCuenta" class="form-control rounded-pill px-4 py-2" placeholder="Contraseña actual">
                </div>
                <button type="button" class="btn btn-danger w-100 py-2 fw-bold rounded-pill" onclick="confirmarEliminacionCuenta()">
                    Aceptar y eliminar cuenta
                </button>
            </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalTarea" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4 shadow-lg">

            <h5 class="fw-bold mb-3">Crear Nueva Tarea</h5>

            <!-- Nombre -->
            <input 
                type="text" 
                id="task-name" 
                class="form-control mb-3 rounded-pill" 
                placeholder="Nombre de la tarea"
            >

            <!-- Fecha límite -->
            <input 
                type="date" 
                id="task-date" 
                class="form-control mb-3 rounded-pill"
            >

            <!-- Descripción -->
            <textarea 
                id="task-desc" 
                class="form-control mb-3"
                placeholder="Descripción..."
                style="border-radius: 15px; height: 80px; resize: none;"
            ></textarea>

            <!-- Prioridad -->
            <select 
                id="task-priority" 
                class="form-select mb-4 rounded-pill"
            >
                <option value="rojo">Prioridad Alta</option>
                <option value="amarillo">Prioridad Media</option>
                <option value="verde" selected>Prioridad Baja</option>
            </select>

            <!-- Botón guardar -->
            <button 
                class="btn-wime mb-3"
                onclick="addItem('tarea')"
            >
                Guardar Tarea
            </button>

            <!-- Compartir -->
            <div class="share-section">

                <label class="small fw-bold mb-2">
                Compartir por correo:
                </label>

                <input 
                type="email"
                id="task-share-email"
                class="form-control input-destinatario mb-2"
                placeholder="correo@ejemplo.com"
                >


            </div>

            </div>
        </div>
    </div>
    
    <div class="modal fade" id="modalRutina" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4 shadow-lg">
                <h5 class="fw-bold mb-3">Crear Nueva Rutina</h5>                <input type="text" id="routine-name" class="form-control mb-3 rounded-pill" placeholder="Nombre de la rutina">
                <textarea id="routine-desc" class="form-control mb-3" placeholder="Descripción..." style="border-radius: 15px; height: 80px; resize: none;"></textarea>
                <div class="row g-2 mb-3">
                    <div class="col-md-6"><input type="date" id="routine-start-date" class="form-control rounded-pill"></div>
                    <div class="col-md-6"><input type="date" id="routine-end-date" class="form-control rounded-pill"></div>
                </div>
                <select id="routine-priority" class="form-select mb-3 rounded-pill">
                    <option value="alta">Prioridad Alta</option>
                    <option value="media" selected>Prioridad Media</option>
                    <option value="baja">Prioridad Baja</option>
                </select>
                <select id="routine-frequency" class="form-select mb-3 rounded-pill">
                    <option value="diario" selected>Diaria</option>
                    <option value="semanal">Semanal</option>
                    <option value="mensual">Mensual</option>
                </select>                <button class="btn-wime mb-3" onclick="addItem('rutina')">Crear Rutina</button>

                <div class="share-section">
                    <label class="small fw-bold mb-2">Compartir por correo:</label>
                    <input type="text" id="routine-share-email" class="form-control input-destinatario" placeholder="correo1@ejemplo.com, correo2@ejemplo.com">
                </div>
            </div>
        </div>
    </div>

<div class="modal fade" id="modalNotif" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg p-4">

      <h4 class="fw-bold mb-2">Notificaciones</h4>
      <hr class="opacity-50 mb-4">

      <!-- CONTENEDOR DINÁMICO -->
      <div id="listaNotificaciones" class="lista-notificaciones"></div>

      <!-- BOTONES -->
      <div class="d-flex justify-content-between mt-3">
        <button class="btn btn-sm btn-outline-primary" id="btnMarcarLeidas">
          Marcar como leídas
        </button>

        <button class="btn btn-sm btn-outline-danger" id="btnEliminarNotificaciones">
          Borrar todas
        </button>
      </div>

    </div>
  </div>
</div>

    <div class="modal fade" id="modalEditarTarea" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4 shadow-lg">
          <h5 class="fw-bold mb-3">Editar tarea</h5>

          <input type="hidden" id="edit-task-id">
          <input type="hidden" id="edit-task-estado">

          <label class="small fw-bold mb-1">Título</label>
          <input type="text" id="edit-task-titulo" class="form-control mb-3 rounded-pill" placeholder="Título de la tarea">

          <label class="small fw-bold mb-1">Fecha límite</label>
          <input type="date" id="edit-task-fecha" class="form-control mb-3 rounded-pill">

          <label class="small fw-bold mb-1">Descripción</label>
          <textarea id="edit-task-descripcion" class="form-control mb-3" placeholder="Descripción..." style="border-radius: 15px; height: 90px; resize: none;"></textarea>

          <label class="small fw-bold mb-1">Prioridad</label>
          <select id="edit-task-prioridad" class="form-select mb-3 rounded-pill">
            <option value="alta">Prioridad Alta</option>
            <option value="media">Prioridad Media</option>
            <option value="baja">Prioridad Baja</option>
          </select>

          <button type="button" id="btn-guardar-edicion" class="btn-wime mb-3">Guardar cambios</button>

          <div class="share-section">
            <label class="small fw-bold mb-2">Compartir tarea con otro correo:</label>
            <input type="text" id="edit-task-share-email" class="form-control input-destinatario mb-2" placeholder="correo1@ejemplo.com, correo2@ejemplo.com">
            <button type="button" id="btn-compartir-edicion" class="btn-share">
              <i class="bi bi-send me-2"></i>Compartir tarea
            </button>
          </div>
        </div>
      </div>
    </div>


<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 9999">

  <div id="toastWime" class="toast align-items-center text-bg-dark border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastMensaje">
        Mensaje
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>

</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../Js/Functions/Toast.js"></script>
<script src="../../Js/Modules/Wime_Modulo_CT.js"></script>
<script src="../../Js/Modules/Wime_Modulo_CR.js"></script>
<script src="../../Js/Functions/Notificacion.js"></script>

</body>
</html>
