<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>WIME | Tablero</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../../Css/Interfaces/Wime_interfaz_Tablero.Css">
    <link rel="icon" type="image/png" href="/IMG/Logo_Wime.png" />

    <script defer src="../../Js/Functions/Estadisticas.js"></script>
    <script defer src="../../Js/Functions/Wime_Func_Calendario.js"></script>
    <script defer src="../../Js/Modules/Wime_Tablero.js"></script>
    <script defer src="../../Js/Functions/Wime_Func_Editar.js"></script>

</head>
<body>

    <div class="sidebar">
        <h2>WIME</h2>
        <hr>
        <nav>
            <a href="#" class="nav-active"><i class="bi bi-grid-1x2"></i> Mi Tablero</a>
            <a href="/cuenta"><i class="bi bi-person-circle"></i> Perfil</a>
            <button class="nav-btn" data-bs-toggle="modal" data-bs-target="#modalTarea"><i class="bi bi-plus-circle"></i> Nueva Tarea</button>
            <button class="nav-btn" data-bs-toggle="modal" data-bs-target="#modalRutina"><i class="bi bi-calendar-plus"></i> Nueva Rutina</button>
            <button class="nav-btn" data-bs-toggle="modal" data-bs-target="#modalNotif"><i class="bi bi-bell"></i>Notificaciones</button>
            <hr>
            <button class="nav-btn" onclick="cerrarSesion()"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</button>
        </nav>

        <div class="sidebar-calendar">
            <div class="d-flex justify-content-between align-items-center mb-3 text-white">
                <i class="bi bi-chevron-left cursor-pointer" onclick="moveMonth(-1)"></i>
                <span id="calMonthYear" class="fw-bold"></span>
                <i class="bi bi-chevron-right cursor-pointer" onclick="moveMonth(1)"></i>
            </div>
            <div class="cal-grid" id="calGrid"></div>
        </div>
    </div>

    <main class="main-content">
        <div class="user-banner shadow">
            <img id="fotoPerfil" src="../../IMG/EmptyAvatar.jpeg" alt="Perfil">
            <div>
                <h1 id="bienvenida" class="fw-bold mb-1" style="color: white !important;"></h1>
                <p class="mb-0 opacity-75" id="fecha-actual" style="color: white !important;"></p>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold m-0">Metas del Día</h4>
            <div class="btn-group" id="filter-group">
                <button class="btn btn-outline-primary btn-sm active" onclick="filtrar('todas', this)">Todas</button>
                <button class="btn btn-outline-primary btn-sm" onclick="filtrar('rutina', this)">Rutinas</button>
                <button class="btn btn-outline-primary btn-sm" onclick="filtrar('tarea', this)">Tareas</button>
            </div>
        </div>

        <div id="contenedor-items" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3"></div>

        <div class="performance-card shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0"><i class="bi bi-bar-chart-line me-2"></i>Rendimiento</h5>
                <div class="btn-group btn-group-sm" id="performance-filter-group">
                    <button class="btn btn-outline-primary active" id="btn-rendimiento-todas" type="button">Todas</button>
                    <button class="btn btn-outline-primary" id="btn-rendimiento-rutina" type="button">Rutinas</button>
                    <button class="btn btn-outline-primary" id="btn-rendimiento-tarea" type="button">Tareas</button>
                </div>
            </div>            <div class="mb-4">
                <div class="d-flex justify-content-between"><span class="small fw-bold">Completadas</span><span id="stat-completadas" class="text-success small fw-bold">0%</span></div>
                <div class="progreso"><div id="bar-completadas" class="barra verde" style="width: 0%;"></div></div>
            </div>
            <div class="mb-4">
                <div class="d-flex justify-content-between"><span class="small fw-bold">Pendientes</span><span id="stat-pendientes" class="text-warning small fw-bold">0%</span></div>
                <div class="progreso"><div id="bar-pendientes" class="barra amarillo" style="width: 0%;"></div></div>
            </div>

            <div class="mb-0">
            <div class="d-flex justify-content-between">
                <span class="small fw-bold">Vencidas</span>
                <span id="stat-vencidas" class="text-danger small fw-bold">0%</span>
            </div>

            <div class="progreso">
                <div id="bar-vencidas" class="barra rojo" style="width:0%"></div>
            </div>
            </div>
        </div>

        

        
    </main>

    <div class="modal fade" id="modalTarea" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4 shadow-lg">
            <button type="button" class="btn-close modal-close-btn" data-bs-dismiss="modal" aria-label="Cerrar"></button>

            <h5 class="fw-bold mb-3">Crear Nueva Tarea</h5>

            <!-- Nombre -->
            <input 
                type="text" 
                id="task-name" 
                class="form-control mb-3 rounded-pill" 
                placeholder="Nombre de la tarea"
            >

            <!-- Fecha límite -->
            <input 
                type="date" 
                id="task-date" 
                class="form-control mb-3 rounded-pill"
            >

            <!-- Descripción -->
            <textarea 
                id="task-desc" 
                class="form-control mb-3"
                placeholder="Descripción..."
                style="border-radius: 15px; height: 80px; resize: none;"
            ></textarea>

            <!-- Prioridad -->
            <select 
                id="task-priority" 
                class="form-select mb-4 rounded-pill"
            >
                <option value="rojo">Prioridad Alta</option>
                <option value="amarillo">Prioridad Media</option>
                <option value="verde" selected>Prioridad Baja</option>
            </select>

            <!-- Botón guardar -->
            <button 
                class="btn-wime mb-3"
                onclick="addItem('tarea')"
            >
                Guardar Tarea
            </button>

            <!-- Compartir -->
            <div class="share-section">

                <label class="small fw-bold mb-2">
                Compartir por correo:
                </label>

                <input 
                type="email"
                id="task-share-email"
                class="form-control input-destinatario mb-2"
                placeholder="correo@ejemplo.com">
            </div>

            </div>
        </div>
    </div>

<div class="modal fade" id="modalRutina" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4 shadow-lg">
                <button type="button" class="btn-close modal-close-btn" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                <h5 class="fw-bold mb-3">Crear Nueva Rutina</h5>
                <input type="text" id="routine-name" class="form-control mb-3 rounded-pill" placeholder="Nombre de la rutina">
                <textarea id="routine-desc" class="form-control mb-3" placeholder="Descripción..." style="border-radius: 15px; height: 80px; resize: none;"></textarea>
                <div class="row g-2 mb-3 routine-date-group">
                    <div class="col-md-6">
                        <label for="routine-start-date" class="small fw-bold mb-1 d-block">Fecha inicio</label>
                        <input type="date" id="routine-start-date" class="form-control rounded-pill">
                    </div>
                    <div class="col-md-6">
                        <label for="routine-end-date" class="small fw-bold mb-1 d-block">Fecha fin</label>
                        <input type="date" id="routine-end-date" class="form-control rounded-pill">
                    </div>
                </div>
                <select id="routine-priority" class="form-select mb-3 rounded-pill">
                    <option value="alta">Prioridad Alta</option>
                    <option value="media" selected>Prioridad Media</option>
                    <option value="baja">Prioridad Baja</option>
                </select>
                <select id="routine-frequency" class="form-select mb-3 rounded-pill">
                    <option value="diario" selected>Diaria</option>
                    <option value="semanal">Semanal</option>
                    <option value="mensual">Mensual</option>
                </select>                <button class="btn-wime mb-3" onclick="addItem('rutina')">Crear Rutina</button>

                <div class="share-section">
                    <label class="small fw-bold mb-2">Compartir por correo:</label>
                    <input type="text" id="routine-share-email" class="form-control input-destinatario" placeholder="correo1@ejemplo.com, correo2@ejemplo.com">
                </div>
            </div>
        </div>
    </div>
    
<div class="modal fade" id="modalNotif" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg p-4">


      <button type="button" class="btn-close modal-close-btn" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      <h4 class="fw-bold mb-2">Notificaciones</h4>
      <hr class="opacity-50 mb-4">

      <!-- CONTENEDOR DINÁMICO -->
      <div id="listaNotificaciones" class="lista-notificaciones"></div>

      <!-- BOTONES -->
      <div class="d-flex justify-content-between mt-3">
        <button class="btn btn-sm btn-outline-primary" id="btnMarcarLeidas">
          Marcar como leídas
        </button>

        <button class="btn btn-sm btn-outline-danger" id="btnEliminarNotificaciones">
          Borrar todas
        </button>
      </div>

    </div>
  </div>
</div>



<div class="modal fade" id="modalEditarRutina" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4 shadow-lg">

            <button type="button" class="btn-close modal-close-btn" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          <h5 class="fw-bold mb-3">Editar rutina</h5>

          <input type="hidden" id="edit-routine-id">
          <input type="hidden" id="edit-routine-estado">

          <label class="small fw-bold mb-1">Nombre</label>
          <input type="text" id="edit-routine-nombre" class="form-control mb-3 rounded-pill" placeholder="Nombre de la rutina">

          <label class="small fw-bold mb-1">Fecha de asignación</label>
          <input type="date" id="edit-routine-fecha-inicio" class="form-control mb-3 rounded-pill">

          <label class="small fw-bold mb-1">Fecha final</label>
          <input type="date" id="edit-routine-fecha-fin" class="form-control mb-3 rounded-pill">

          <label class="small fw-bold mb-1">Descripción</label>
          <textarea id="edit-routine-descripcion" class="form-control mb-3" placeholder="Descripción..." style="border-radius: 15px; height: 90px; resize: none;"></textarea>

          <label class="small fw-bold mb-1">Prioridad</label>
          <select id="edit-routine-prioridad" class="form-select mb-3 rounded-pill">
            <option value="alta">Prioridad Alta</option>
            <option value="media">Prioridad Media</option>
            <option value="baja">Prioridad Baja</option>
          </select>

          <label class="small fw-bold mb-1">Frecuencia</label>
          <select id="edit-routine-frecuencia" class="form-select mb-3 rounded-pill">
            <option value="diario">Diaria</option>
            <option value="semanal">Semanal</option>
            <option value="mensual">Mensual</option>
          </select>

          <button type="button" id="btn-guardar-edicion-rutina" class="btn-wime mb-3">Guardar cambios</button>

          <div class="share-section">
            <label class="small fw-bold mb-2">Compartir rutina con otro correo:</label>
            <input type="text" id="edit-routine-share-email" class="form-control input-destinatario mb-2" placeholder="correo1@ejemplo.com, correo2@ejemplo.com">
            <button type="button" id="btn-compartir-rutina-edicion" class="btn-share">
              <i class="bi bi-send me-2"></i>Compartir rutina
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modalEditarTarea" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4 shadow-lg">
          <button type="button" class="btn-close modal-close-btn" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          <h5 class="fw-bold mb-3">Editar tarea</h5>

          <input type="hidden" id="edit-task-id">
          <input type="hidden" id="edit-task-estado">

          <label class="small fw-bold mb-1">Título</label>
          <input type="text" id="edit-task-titulo" class="form-control mb-3 rounded-pill" placeholder="Título de la tarea">

          <label class="small fw-bold mb-1">Fecha límite</label>
          <input type="date" id="edit-task-fecha" class="form-control mb-3 rounded-pill">

          <label class="small fw-bold mb-1">Descripción</label>
          <textarea id="edit-task-descripcion" class="form-control mb-3" placeholder="Descripción..." style="border-radius: 15px; height: 90px; resize: none;"></textarea>

          <label class="small fw-bold mb-1">Prioridad</label>
          <select id="edit-task-prioridad" class="form-select mb-3 rounded-pill">
            <option value="alta">Prioridad Alta</option>
            <option value="media">Prioridad Media</option>
            <option value="baja">Prioridad Baja</option>
          </select>

          <button type="button" id="btn-guardar-edicion" class="btn-wime mb-3">Guardar cambios</button>

          <div class="share-section">
            <label class="small fw-bold mb-2">Compartir tarea con otro correo:</label>
            <input type="text" id="edit-task-share-email" class="form-control input-destinatario mb-2" placeholder="correo1@ejemplo.com, correo2@ejemplo.com">
            <button type="button" id="btn-compartir-edicion" class="btn-share">
              <i class="bi bi-send me-2"></i>Compartir tarea
            </button>
          </div>
        </div>
      </div>
    </div>



    <div id="toast-container"
        class="toast-container position-fixed top-0 end-0 p-3"
        style="z-index: 9999;">
    </div>

    <button id="themeToggle" class="theme-btn"><i id="themeIcon" class="bi bi-sun"></i></button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../Js/Modules/Wime_Modulo_CT.js"></script>
    <script src="../../Js/Functions/Toast.js"></script>
    <script src="../../Js/Functions/Notificacion.js"></script>
    <script src="../../Js/Functions/Estadisticas.js"></script>
    <script src="../../Js/Modules/Wime_Modulo_CR.js"></script>




</body>
</html>
